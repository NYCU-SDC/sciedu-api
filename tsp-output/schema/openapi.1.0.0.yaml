                properties:
                  title:
                    type: string
                    description: The problem's title. A short, human-readable summary of the problem type.
                  detail:
                    type: string
                    description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
                  instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                  status:
                    type: number
                    enum:
                      - 409
                  type:
                    type: string
                    enum:
                      - urn:sciedu:problem:REVISION_CONFLICT
                      - urn:sciedu:problem:COURSE_NOT_EDITABLE
                      - urn:sciedu:problem:EDITOR_DOCUMENT_REQUIRED
                      - urn:sciedu:problem:IDEMPOTENCY_KEY_REUSED
                      - urn:sciedu:problem:REQUEST_IN_PROGRESS
                      - urn:sciedu:problem:ASSIGNMENT_CONFLICT
                description: Uses the existing summer ProblemDetail fields. Stable business types are urn:sciedu:problem:<kind>; do not parse detail. The current summer version does not support code/currentRevision/issues, so this contract does not require those extensions.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Questions
      security:
        - ApiKeyAuth: []
  /api/questions/{id}/answers:
