openapi: 3.1.0
info:
  title: SciEdu API
  version: 1.0.0
tags:
  - name: Healthz
  - name: Questions
  - name: Chat
  - name: Content
  - name: Auth
  - name: Users
  - name: Courses
  - name: Pages
  - name: Experiments
paths:
  /api/auth/callback:
    get:
      operationId: OAuthCallback_callback
      description: |-
        Complete the Google OAuth login flow using a verified email identity. Before
        issuing a session, find the user by the stable provider subject or atomically
        create the OAuth identity and a user with the STUDENT role. Existing identities
        must not create duplicate users, and disabled users must be denied rather than
        recreated. Set session cookies on success and redirect the client to the
        originally requested URL.
      parameters:
        - name: code
          in: query
          required: false
          description: OAuth authorization code returned by Google.
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          description: OAuth state value used to validate the login attempt.
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: Auth_logout
      description: Revoke the entire refresh token family, clear session cookies, and end the session.
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token session cookie to revoke. Missing cookies still result in a cleared session.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/refresh:
    post:
      operationId: Auth_refresh
      description: |-
        Rotate the refresh token, set new session cookies, and return updated
        session expiry metadata.
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token session cookie to rotate.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/session:
    get:
      operationId: Auth_session
      description: Return metadata for the authenticated session using session cookies.
      parameters:
        - name: access_token
          in: cookie
          required: true
          description: Access token session cookie.
          schema:
            type: string
          explode: false
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token session cookie.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Auth
  /api/chat:
    get:
      operationId: Chats_list
      description: |-
        List the authenticated user's chats, ordered by `updatedAt` descending
        (most recently updated first). Powers the chat history sidebar.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page. Maximum value is 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat.PaginatedChatResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    post:
      operationId: Chats_create
      description: Create a new chat session.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chatID:
                    $ref: '#/components/schemas/uuid'
                required:
                  - chatID
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/stream/{messageId}:
    get:
      operationId: Stream_get
      description: Stream the assistant reply for a given message using Server-Sent Events. Returns 404 if the messageId does not exist, 400 if the message has no reply pending yet.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Connection:
              required: true
              schema:
                type: string
                enum:
                  - keep-alive
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Chat.StreamDelta'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/{chatId}:
    get:
      operationId: Chats_get
      description: Returns chat and all messages in the chat.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    allOf:
                      - $ref: '#/components/schemas/uuid'
                    description: Chat ID
                  title:
                    type: string
                    description: |-
                      Display title for the chat. Auto-generated by the backend (typically derived
                      from the first user message). May be an empty string for a chat that has not
                      yet received any messages. Truncation for display is the client's responsibility.
                  createdAt:
                    type: string
                    format: date-time
                    description: Timestamp when the chat was created
                  updatedAt:
                    type: string
                    format: date-time
                    description: |-
                      Timestamp when the chat was last updated. Updated whenever a new message is
                      appended to the chat. Used as the sort key for the chat history sidebar
                      (most recently updated first).
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat.Message'
                required:
                  - id
                  - title
                  - createdAt
                  - updatedAt
                  - messages
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    delete:
      operationId: Chats_delete
      description: |2-
          Delete a chat session and all of its messages. Only the chat's owner may
          delete it; requests for chats owned by another user return 404 (the chat
          is not visible to the caller).
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    post:
      operationId: Chats_createMessage
      description: Send a message to a chat session. Returns the sent message and the ID of the pending reply message.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    allOf:
                      - $ref: '#/components/schemas/Chat.Message'
                    description: The user's message that was just sent. Its `id` is the ID of the user's message.
                  replyMessageID:
                    allOf:
                      - $ref: '#/components/schemas/uuid'
                    description: |-
                      The ID of the assistant's reply message, which is pre-created in a `streaming` state.
                      The SSE stream endpoint (`GET /chat/stream/{messageId}`) expects the assistant's message ID — that is this field.
                      The `message.id` in this response is the user's message ID, which cannot be used to open a stream.
                required:
                  - message
                  - replyMessageID
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                previousID:
                  $ref: '#/components/schemas/uuid'
              required:
                - content
      security:
        - ApiKeyAuth: []
  /api/content/media:
    post:
      operationId: Content_createMedia
      description: |2-
            Upload a new media file (multipart/form-data).
            The `content` part carries the raw file bytes.
            Returns the created MediaContent record with the stored file path.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.MediaContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  description: Raw file bytes to upload
              required:
                - content
      security:
        - ApiKeyAuth: []
  /api/content/media/{id}:
    get:
      operationId: Content_streamMedia
      description: |2-
          Stream a media file. The response body is the raw binary file stream.
          The handler is responsible for closing the stream after the response is sent.
          Do NOT buffer the entire file into memory; use io.Copy to pipe the stream
          directly to the response writer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            '*/*':
              schema:
                contentMediaType: '*/*'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
  /api/content/text:
    get:
      operationId: Content_listText
      description: List text contents (paginated).
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page. Maximum value is 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.PaginatedTextResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
    post:
      operationId: Content_createText
      description: Create a new text content
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.TextContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Content.CreateTextRequest'
      security:
        - ApiKeyAuth: []
  /api/content/text/batch:
    post:
      operationId: Content_batchGetText
      description: Batch-fetch text contents by a list of IDs. Returns an array of TextContent.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Content.TextContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Content.BatchTextRequest'
      security:
        - ApiKeyAuth: []
  /api/content/text/{id}:
    get:
      operationId: Content_getText
      description: Get a single text content by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.TextContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
  /api/content/{id}:
    delete:
      operationId: Content_delete
      description: Delete a content item (text or media) by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
  /api/courses:
    get:
      operationId: Courses_list
      description: List courses. Requires EXPERIMENTER or ADMIN.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Courses.CourseStatus'
          explode: false
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courses.PaginatedCoursesResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Courses
      security:
        - ApiKeyAuth: []
    post:
      operationId: Courses_create
      description: Create a DRAFT course. Requires EXPERIMENTER or ADMIN. Course codes must be unique.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courses.Course'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Courses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Courses.CreateCourseRequest'
      security:
        - ApiKeyAuth: []
  /api/courses/{courseId}/pages:
    get:
      operationId: CoursePages_list
      description: List pages in display order. Students may only access a PUBLISHED course assigned to their current experiment.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pages.Page'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Pages
      security:
        - ApiKeyAuth: []
    post:
      operationId: CoursePages_create
      description: Create a page in a course. Requires EXPERIMENTER or ADMIN.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pages.PageDetail'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pages.CreatePageRequest'
      security:
        - ApiKeyAuth: []
  /api/courses/{courseId}/pages/order:
    put:
      operationId: CoursePages_reorder
      description: Atomically reorder every page in a course. Requires EXPERIMENTER or ADMIN.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pages.Page'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
