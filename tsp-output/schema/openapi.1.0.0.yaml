      required:
        - id
        - type
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Question ID
        type:
          allOf:
            - $ref: '#/components/schemas/Questions.QuestionType'
          description: Question type
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Question content/description
        options:
          type: array
          items:
            $ref: '#/components/schemas/Questions.Option'
          description: List of options (only populated when type is CHOICE)
      description: Question model (maps to questions table)
    Questions.QuestionType:
      type: string
      enum:
        - CHOICE
        - TEXT
      description: Question types
    Questions.SubmitAnswerRequest:
      type: object
      properties:
        selectedOptionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Selected option ID (if it is a choice question)
        textAnswer:
          type: string
          minLength: 1
          maxLength: 2000
          description: Textual answer (if it is a text-based question)
      description: Payload for submitting an answer
    Questions.TextCorrectAnswer:
      type: object
      required:
        - type
        - referenceAnswer
      properties:
        type:
          type: string
          enum:
            - TEXT
        referenceAnswer:
          type: string
          minLength: 1
          maxLength: 2000
      allOf:
        - $ref: '#/components/schemas/Questions.CorrectAnswerBase'
    Questions.TextCorrectAnswerRequest:
      type: object
      required:
        - type
        - referenceAnswer
      properties:
        type:
          type: string
          enum:
            - TEXT
        referenceAnswer:
          type: string
          minLength: 1
          maxLength: 2000
      description: Payload for storing a reference answer for future TEXT grading.
    Questions.UpsertCorrectAnswerRequest:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Questions.ChoiceCorrectAnswerRequest'
        - $ref: '#/components/schemas/Questions.TextCorrectAnswerRequest'
      discriminator:
        propertyName: type
        mapping:
          CHOICE: '#/components/schemas/Questions.ChoiceCorrectAnswerRequest'
          TEXT: '#/components/schemas/Questions.TextCorrectAnswerRequest'
      description: Correct-answer payload. The discriminator must match the question type.
    Unauthorized:
      type: object
      required:
        - title
        - status
        - type
      properties:
        title:
          type: string
          enum:
            - Unauthorized
        status:
          type: number
          enum:
            - 401
        type:
          type: string
          enum:
            - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
    Users.PaginatedUsersResponse:
      type: object
      required:
        - items
        - totalPages
        - totalItems
        - currentPage
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Users.User'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
      description: Paginated user directory response.
    Users.StudentGrade:
      type: integer
      format: int32
      minimum: 1
      maximum: 12
      description: A student's grade level, from elementary grade 1 through secondary grade 12.
    Users.UpdateStudentGradeRequest:
      type: object
      required:
        - grade
      properties:
        grade:
          $ref: '#/components/schemas/Users.StudentGrade'
      description: Sets a student's grade. A grade can be replaced but cannot be cleared.
    Users.UpdateUserRolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Users.UserRole'
          minItems: 1
          maxItems: 3
      description: Fully replaces a user's roles. Roles must be unique.
    Users.User:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Users.UserRole'
        grade:
          allOf:
            - $ref: '#/components/schemas/Users.StudentGrade'
          description: The student's grade level. Omitted when the user is not a STUDENT or has not set a grade.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: A SciEdu user profile.
    Users.UserRole:
      type: string
      enum:
        - STUDENT
        - EXPERIMENTER
        - ADMIN
      description: Roles that can be assigned to a SciEdu user.
    Versions:
      type: string
      enum:
        - 1.0.0
    uuid:
      type: string
      format: uuid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: access_token
servers:
  - url: https://api.dev.sciedu.sdc.nycu.club
    description: SciEdu server endpoint
    variables: {}
