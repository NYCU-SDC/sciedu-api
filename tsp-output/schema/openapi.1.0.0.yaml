components:
  parameters:
    Materials.IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
  schemas:
    Auth.SessionResponse:
      type: object
      required:
        - username
        - email
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
      properties:
        username:
          type: string
          description: Authenticated user's display username.
        email:
          type: string
          description: Authenticated user's email address.
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: Timestamp when the current access token expires.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Timestamp when the current refresh token family expires.
      description: |-
        Authenticated session metadata. Session tokens are issued and refreshed through
        HttpOnly cookies and are intentionally not exposed in response bodies.
    Chat.AgentEndEvent:
      type: object
      required:
        - type
        - agent
      properties:
        type:
          type: string
          enum:
            - agent_end
        agent:
          type: string
      description: Signals that an agent has finished producing parts.
    Chat.AgentRun:
      type: object
      required:
        - id
        - agent
      properties:
        id:
          type: string
          description: Stable run identifier within the message.
        agent:
          type: string
          description: ID of the character or agent invoked for this run.
        parentRunID:
          type: string
          description: ID of the agent run that invoked this run, if it was nested.
        summonedBy:
          type: string
          description: Identifier of the action that summoned this run.
      description: A single invocation of a character while producing an agentic response.
    Chat.AgentStartEvent:
      type: object
      required:
        - type
        - agent
      properties:
        type:
          type: string
          enum:
            - agent_start
        agent:
          type: string
        parent:
          type: string
        summonedBy:
          type: string
      description: Signals that an agent has started producing parts.
    Chat.CastEvent:
      type: object
      required:
        - type
        - characters
      properties:
        type:
          type: string
          enum:
            - cast
        characters:
          type: array
          items:
            $ref: '#/components/schemas/Chat.Character'
      description: Announces the characters participating in the response.
    Chat.Character:
      type: object
      required:
        - id
        - displayName
        - role
      properties:
        id:
          type: string
          description: Stable character identifier used by message parts and stream events.
        displayName:
          type: string
          description: Human-readable character name.
        role:
          type: string
          description: Character role presented to the user.
      description: A character participating in an agentic response.
    Chat.Chat:
      type: object
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Chat ID
        title:
          type: string
          description: |-
            Display title for the chat. Auto-generated by the backend (typically derived
            from the first user message). May be an empty string for a chat that has not
            yet received any messages. Truncation for display is the client's responsibility.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the chat was created
        updatedAt:
          type: string
          format: date-time
          description: |-
            Timestamp when the chat was last updated. Updated whenever a new message is
            appended to the chat. Used as the sort key for the chat history sidebar
            (most recently updated first).
      description: A chat session belonging to the authenticated user.
    Chat.ChatResult:
      type: object
      required:
        - chatId
      properties:
        chatId:
          $ref: '#/components/schemas/uuid'
      unevaluatedProperties:
        not: {}
    Chat.CourseChatLookup:
      type: object
      required:
        - chatId
      properties:
        chatId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
    Chat.CourseContext:
      type: object
      required:
        - experimentId
        - courseId
        - pageId
      properties:
        experimentId:
          $ref: '#/components/schemas/uuid'
        courseId:
          $ref: '#/components/schemas/uuid'
        pageId:
          $ref: '#/components/schemas/uuid'
      unevaluatedProperties:
        not: {}
    Chat.CreateChatRequest:
      type: object
      properties:
        courseContext:
          $ref: '#/components/schemas/Chat.CourseContext'
      unevaluatedProperties:
        not: {}
    Chat.DeltaEvent:
      type: object
      required:
        - type
        - index
        - delta
      properties:
        type:
          type: string
          enum:
            - delta
        index:
          type: integer
          format: int32
        delta:
          type: string
      description: Appends incremental content to the part at the specified index.
    Chat.DoneEvent:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - done
        finishReason:
          type: string
        status:
          $ref: '#/components/schemas/Chat.MessageStatus'
      description: Terminates a successfully completed stream.
    Chat.ErrorEvent:
      type: object
      required:
        - type
        - error
        - code
      properties:
        type:
          type: string
          enum:
            - error
        error:
          type: string
        code:
          type: string
      description: Terminates a failed stream.
    Chat.Message:
      type: object
      required:
        - id
        - content
        - role
        - status
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Message ID
        content:
          type: string
          description: |-
            Plain-text representation of the message. For an agentic response, this is
            formed by concatenating the `text` of every non-internal `text` part in
            `parts` array order without inserting separators.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Chat.MessagePart'
          description: Structured agentic content. Omitted for messages without agentic parts.
        characters:
          type: array
          items:
            $ref: '#/components/schemas/Chat.Character'
          description: Snapshot of the characters used by the agentic response.
        agentRuns:
          type: array
          items:
            $ref: '#/components/schemas/Chat.AgentRun'
