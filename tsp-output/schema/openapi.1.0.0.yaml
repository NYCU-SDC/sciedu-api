openapi: 3.1.0
info:
  title: SciEdu API
  version: 1.0.0
tags:
  - name: Healthz
  - name: Questions
  - name: Chat
  - name: Content
  - name: Auth
paths:
  /api/auth/callback:
    get:
      operationId: OAuthCallback_callback
      description: |-
        Complete the Google OAuth login flow, set session cookies on success, and
        redirect the client to the originally requested URL.
      parameters:
        - name: code
          in: query
          required: false
          description: OAuth authorization code returned by Google.
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          description: OAuth state value used to validate the login attempt.
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: Auth_logout
      description: Revoke the entire refresh token family, clear session cookies, and end the session.
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token session cookie to revoke. Missing cookies still result in a cleared session.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/refresh:
    post:
      operationId: Auth_refresh
      description: |-
        Rotate the refresh token, set new session cookies, and return updated
        session expiry metadata.
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token session cookie to rotate.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/session:
    get:
      operationId: Auth_session
      description: Return metadata for the authenticated session using session cookies.
      parameters:
        - name: access_token
          in: cookie
          required: true
          description: Access token session cookie.
          schema:
            type: string
          explode: false
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token session cookie.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Auth
  /api/chat:
    get:
      operationId: Chats_list
      description: |-
        List the authenticated user's chats, ordered by `updatedAt` descending
        (most recently updated first). Powers the chat history sidebar.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page. Maximum value is 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat.PaginatedChatResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    post:
      operationId: Chats_create
      description: Create a new chat session.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chatID:
                    $ref: '#/components/schemas/uuid'
                required:
                  - chatID
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/stream/{messageId}:
    get:
      operationId: Stream_get
      description: Stream the assistant reply for a given message using Server-Sent Events. Returns 404 if the messageId does not exist, 400 if the message has no reply pending yet.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Connection:
              required: true
              schema:
                type: string
                enum:
                  - keep-alive
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Chat.StreamDelta'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/{chatId}:
    get:
      operationId: Chats_get
      description: Returns chat and all messages in the chat.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    allOf:
                      - $ref: '#/components/schemas/uuid'
                    description: Chat ID
                  title:
                    type: string
                    description: |-
                      Display title for the chat. Auto-generated by the backend (typically derived
                      from the first user message). May be an empty string for a chat that has not
                      yet received any messages. Truncation for display is the client's responsibility.
                  createdAt:
                    type: string
                    format: date-time
                    description: Timestamp when the chat was created
                  updatedAt:
                    type: string
                    format: date-time
                    description: |-
                      Timestamp when the chat was last updated. Updated whenever a new message is
                      appended to the chat. Used as the sort key for the chat history sidebar
                      (most recently updated first).
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat.Message'
                required:
                  - id
                  - title
                  - createdAt
                  - updatedAt
                  - messages
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    delete:
      operationId: Chats_delete
      description: |2-
          Delete a chat session and all of its messages. Only the chat's owner may
          delete it; requests for chats owned by another user return 404 (the chat
          is not visible to the caller).
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    post:
      operationId: Chats_createMessage
      description: Send a message to a chat session. Returns the sent message and the ID of the pending reply message.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    allOf:
                      - $ref: '#/components/schemas/Chat.Message'
                    description: The user's message that was just sent. Its `id` is the ID of the user's message.
                  replyMessageID:
                    allOf:
                      - $ref: '#/components/schemas/uuid'
                    description: |-
                      The ID of the assistant's reply message, which is pre-created in a `streaming` state.
                      The SSE stream endpoint (`GET /chat/stream/{messageId}`) expects the assistant's message ID — that is this field.
                      The `message.id` in this response is the user's message ID, which cannot be used to open a stream.
                required:
                  - message
                  - replyMessageID
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                previousID:
                  $ref: '#/components/schemas/uuid'
              required:
                - content
      security:
        - ApiKeyAuth: []
  /api/content/media:
    post:
      operationId: Content_createMedia
      description: |2-
            Upload a new media file (multipart/form-data).
            The `content` part carries the raw file bytes.
            Returns the created MediaContent record with the stored file path.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.MediaContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  description: Raw file bytes to upload
              required:
                - content
      security:
        - ApiKeyAuth: []
  /api/content/media/{id}:
    get:
      operationId: Content_streamMedia
      description: |2-
          Stream a media file. The response body is the raw binary file stream.
          The handler is responsible for closing the stream after the response is sent.
          Do NOT buffer the entire file into memory; use io.Copy to pipe the stream
          directly to the response writer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            '*/*':
              schema:
                contentMediaType: '*/*'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
  /api/content/text:
    get:
      operationId: Content_listText
      description: List text contents (paginated).
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page. Maximum value is 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.PaginatedTextResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
    post:
      operationId: Content_createText
      description: Create a new text content
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.TextContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Content.CreateTextRequest'
      security:
        - ApiKeyAuth: []
  /api/content/text/batch:
    post:
      operationId: Content_batchGetText
      description: Batch-fetch text contents by a list of IDs. Returns an array of TextContent.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Content.TextContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Content.BatchTextRequest'
      security:
        - ApiKeyAuth: []
  /api/content/text/{id}:
    get:
      operationId: Content_getText
      description: Get a single text content by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content.TextContent'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
  /api/content/{id}:
    delete:
      operationId: Content_delete
      description: Delete a content item (text or media) by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Content
      security:
        - ApiKeyAuth: []
  /api/healthz:
    get:
      operationId: Healthz_checkHealthz
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - OK
                required:
                  - status
        '404':
          description: The server cannot find the requested resource.
      tags:
        - Healthz
  /api/login/oauth/google:
    get:
      operationId: OAuthLogin_loginGoogle
      description: |-
        Start the Google OAuth login flow and redirect the browser to the OAuth
        authorization server. The redirect URL is stored server-side with the OAuth
        state and used after callback completion.
      parameters:
        - name: r
          in: query
          required: true
          description: Post-login redirect URL.
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/questions:
    get:
      operationId: Questions_list
      description: List all questions
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Questions.Question'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      security:
        - ApiKeyAuth: []
    post:
      operationId: Questions_create
      description: Create a new question (including options)
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questions.Question'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Questions.CreateUpdateQuestionRequest'
      security:
        - ApiKeyAuth: []
  /api/questions/{id}:
    get:
      operationId: Questions_get
      description: Get details of a single question (including options)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questions.Question'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      security:
        - ApiKeyAuth: []
    put:
      operationId: Questions_update
      description: Update a question (Full update; replaces existing options)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questions.Question'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Questions.CreateUpdateQuestionRequest'
      security:
        - ApiKeyAuth: []
    delete:
      operationId: Questions_delete
      description: Delete a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      security:
        - ApiKeyAuth: []
  /api/questions/{id}/answers:
    get:
      operationId: Questions_listAnswers
      description: Get all answers for a specific question (for Experimenter view)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Questions.Answer'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      security:
        - ApiKeyAuth: []
    post:
      operationId: Questions_submitAnswer
      description: Submit an answer for a specific question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questions.Answer'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Conflict'
                  - $ref: '#/components/schemas/NotFound'
                  - $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Questions.SubmitAnswerRequest'
      security:
        - ApiKeyAuth: []
components:
  schemas:
    Auth.SessionResponse:
      type: object
      required:
        - username
        - email
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
      properties:
        username:
          type: string
          description: Authenticated user's display username.
        email:
          type: string
          description: Authenticated user's email address.
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: Timestamp when the current access token expires.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Timestamp when the current refresh token family expires.
      description: |-
        Authenticated session metadata. Session tokens are issued and refreshed through
        HttpOnly cookies and are intentionally not exposed in response bodies.
    Chat.Chat:
      type: object
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Chat ID
        title:
          type: string
          description: |-
            Display title for the chat. Auto-generated by the backend (typically derived
            from the first user message). May be an empty string for a chat that has not
            yet received any messages. Truncation for display is the client's responsibility.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the chat was created
        updatedAt:
          type: string
          format: date-time
          description: |-
            Timestamp when the chat was last updated. Updated whenever a new message is
            appended to the chat. Used as the sort key for the chat history sidebar
            (most recently updated first).
      description: A chat session belonging to the authenticated user.
    Chat.Message:
      type: object
      required:
        - id
        - content
        - role
        - status
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Message ID
        content:
          type: string
          description: Message content
        role:
          allOf:
            - $ref: '#/components/schemas/Chat.MessageRole'
          description: Role of the message author
        previousID:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: ID of the previous message in the chain
        status:
          allOf:
            - $ref: '#/components/schemas/Chat.MessageStatus'
          description: Processing status of the message
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the message was created
      description: A single message in a chat session.
    Chat.MessageRole:
      type: string
      enum:
        - user
        - assistant
      description: The role of the message author.
    Chat.MessageStatus:
      type: string
      enum:
        - streaming
        - completed
        - failed
      description: The processing status of a message.
    Chat.PaginatedChatResponse:
      type: object
      required:
        - items
        - totalPages
        - totalItems
        - currentPage
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chat.Chat'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
      description: Paginated list of the authenticated user's chats.
    Chat.StreamDelta:
      type: object
      required:
        - delta
        - isFinished
      properties:
        delta:
          type: string
          description: The streamed content fragment. Empty when `isFinished` is true.
        isFinished:
          type: boolean
          description: Whether this chunk marks the end of the assistant reply stream.
      description: A content delta chunk from the SSE stream.
    Conflict:
      type: object
      required:
        - title
        - status
        - type
        - detail
      properties:
        title:
          type: string
          enum:
            - Conflict
        status:
          type: number
          enum:
            - 409
        type:
          type: string
          enum:
            - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/409
        detail:
          type: string
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
    Content.BatchTextRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          minItems: 1
          maxItems: 100
          description: List of text content IDs to fetch
      description: Request body for batch-fetching text contents by ID
    Content.ContentType:
      type: string
      enum:
        - TEXT
        - MEDIA
      description: Content type discriminant
    Content.CreateTextRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: Text body
      description: Request body for creating a text content
    Content.MediaContent:
      type: object
      required:
        - id
        - type
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Content ID
        type:
          type: string
          enum:
            - MEDIA
          description: Content type — always MEDIA
        content:
          type: string
          description: Stored file path
      description: A media content item (references a stored file)
    Content.PaginatedMediaResponse:
      type: object
      required:
        - items
        - totalPages
        - totalItems
        - currentPage
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Content.MediaContent'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
      description: Paginated list of media contents
    Content.PaginatedTextResponse:
      type: object
      required:
        - items
        - totalPages
        - totalItems
        - currentPage
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Content.TextContent'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
      description: Paginated list of text contents
    Content.TextContent:
      type: object
      required:
        - id
        - type
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Content ID
        type:
          type: string
          enum:
            - TEXT
          description: Content type — always TEXT
        content:
          type: string
          description: Text body
      description: A text content item
    Forbidden:
      type: object
      required:
        - title
        - status
        - type
        - detail
      properties:
        title:
          type: string
          enum:
            - Forbidden
        status:
          type: number
          enum:
            - 403
        type:
          type: string
          enum:
            - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403
        detail:
          type: string
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      type: object
      required:
        - title
        - status
        - type
        - detail
      properties:
        title:
          type: string
          enum:
            - Not Found
        status:
          type: number
          enum:
            - 404
        type:
          type: string
          enum:
            - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/404
        detail:
          type: string
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: Type indicates the URI that identifies the problem type. Defaults to 'about:blank'.
        title:
          type: string
          description: The problem's title. A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The problem's status code.
        detail:
          type: string
          description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
      description: Problem represents a problem detail as defined in RFC 9457. Backend implementation should use the `summer` package (github.com/NYCU-SDC/summer) for constructing and returning these errors.
    Questions.Answer:
      type: object
      required:
        - id
        - questionId
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Answer ID
        questionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: ID of corresponding question
        selectedOptionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: The ID of the option which the user chose
        textAnswer:
          type: string
          description: Textual answer (for TEXT type only)
        createdAt:
          type: string
          format: date-time
          description: Answer creation time
      description: Answer submitted by a student (maps to questions_users_answers table)
    Questions.CreateUpdateQuestionRequest:
      type: object
      required:
        - type
        - content
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/Questions.QuestionType'
          description: Question type
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Question content
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 5
                description: Option label, e.g., A, B, C
              content:
                type: string
                minLength: 1
                maxLength: 1024
                description: Option content
            required:
              - label
              - content
          description: List of options. For CHOICE type, this field is required and cannot be empty.
      description: Payload for creating or updating a question
    Questions.Option:
      type: object
      required:
        - id
        - label
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Option ID
        label:
          type: string
          minLength: 1
          maxLength: 5
          description: Option label, e.g., A, B, C
        content:
          type: string
          minLength: 1
          maxLength: 1024
          description: Option content
      description: Option model (maps to options table)
    Questions.Question:
      type: object
      required:
        - id
        - type
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Question ID
        type:
          allOf:
            - $ref: '#/components/schemas/Questions.QuestionType'
          description: Question type
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Question content/description
        options:
          type: array
          items:
            $ref: '#/components/schemas/Questions.Option'
          description: List of options (only populated when type is CHOICE)
      description: Question model (maps to questions table)
    Questions.QuestionType:
      type: string
      enum:
        - CHOICE
        - TEXT
      description: Question types
    Questions.SubmitAnswerRequest:
      type: object
      properties:
        selectedOptionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Selected option ID (if it is a choice question)
        textAnswer:
          type: string
          minLength: 1
          maxLength: 2000
          description: Textual answer (if it is a text-based question)
      description: Payload for submitting an answer
    Unauthorized:
      type: object
      required:
        - title
        - status
        - type
      properties:
        title:
          type: string
          enum:
            - Unauthorized
        status:
          type: number
          enum:
            - 401
        type:
          type: string
          enum:
            - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
    Versions:
      type: string
      enum:
        - 1.0.0
    uuid:
      type: string
      format: uuid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: access_token
servers:
  - url: https://api.dev.sciedu.sdc.nycu.club
    description: SciEdu server endpoint
    variables: {}
