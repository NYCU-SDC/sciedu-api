  /api/page-visits:
    post:
      operationId: PageVisits_enter
      description: |-
        Record that the authenticated student entered a course page. The server
        records `enteredAt`; clients cannot provide timestamps.

        Before creating the visit, the server closes any open visit belonging to
        the same student and `clientSessionId`, using the new visit's `enteredAt`
        as the old visit's `leftAt`. The close and create operations are atomic.

        `Idempotency-Key` is scoped to the authenticated student. Replaying the
        same key with the same request returns the originally created visit and
        must not close or create another visit. Reusing it with a different request
        returns a conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID used to make retries safe
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVisits.PageVisit'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Page Visits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageVisits.CreatePageVisitRequest'
      security:
        - ApiKeyAuth: []
    get:
      operationId: PageVisits_list
      description: |-
        List page visit records for research and administration. Only users with
        the EXPERIMENTER or ADMIN role may call this operation. Results are ordered
        by `enteredAt` descending.
      parameters:
        - name: studentId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: courseId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: pageId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: clientSessionId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PageVisits.PageVisitStatus'
          explode: false
        - name: enteredFrom
          in: query
          required: false
          description: Include visits entered at or after this timestamp
          schema:
            type: string
            format: date-time
          explode: false
        - name: enteredBefore
          in: query
          required: false
          description: Include visits entered before this timestamp
          schema:
            type: string
            format: date-time
          explode: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page. Maximum value is 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVisits.PaginatedPageVisitResponse'
        '401':
          description: Access is unauthorized.
