          type: string
          description: The problem's title. A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The problem's status code.
        detail:
          type: string
          description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
      description: Problem represents a problem detail as defined in RFC 9457. Backend implementation should use the `summer` package (github.com/NYCU-SDC/summer) for constructing and returning these errors.
    Questions.Answer:
      type: object
      required:
        - id
        - questionId
        - experimentId
        - userId
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Answer ID
        questionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: ID of corresponding question
        experimentId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: ID of the active experiment in which the answer was submitted
        userId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Opaque ID of the user who submitted the answer
        selectedOptionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: The ID of the option which the user chose
        textAnswer:
          type: string
          description: Textual answer (for TEXT type only)
        createdAt:
          type: string
          format: date-time
          description: Answer creation time
      description: |-
        Answer submitted by a student (maps to questions_users_answers table). Each
        answer belongs to exactly one question, user, and experiment. A user may
        submit another answer to the same question in a different experiment.
    Questions.AnswerResult:
      type: object
      required:
        - answerId
        - questionId
        - status
        - resultVisible
      properties:
        answerId:
          $ref: '#/components/schemas/uuid'
        questionId:
          $ref: '#/components/schemas/uuid'
        status:
          $ref: '#/components/schemas/Questions.GradingStatus'
        method:
          $ref: '#/components/schemas/Questions.GradingMethod'
        resultVisible:
          type: boolean
          description: Whether the current caller may see the correctness result
        isCorrect:
          type: boolean
        gradedAt:
          type: string
          format: date-time
      description: |-
        Persisted grading result for an answer. isCorrect is omitted while grading is
        pending or failed, and when the caller is not allowed to see scores.
    Questions.AnswerResultSyncStatus:
      type: string
      enum:
        - PENDING
        - SYNCED
        - FAILED
      description: |-
        Whether every automatically gradable stored submission has an answer result
        evaluated against the current correct-answer version.
    Questions.AnswerWithResult:
      type: object
      required:
        - id
        - questionId
        - experimentId
        - userId
        - createdAt
        - gradingStatus
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Answer ID
        questionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: ID of corresponding question
        experimentId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: ID of the active experiment in which the answer was submitted
        userId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Opaque ID of the user who submitted the answer
        selectedOptionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: The ID of the option which the user chose
        textAnswer:
          type: string
          description: Textual answer (for TEXT type only)
        createdAt:
          type: string
          format: date-time
          description: Answer creation time
        gradingStatus:
          $ref: '#/components/schemas/Questions.GradingStatus'
        gradingMethod:
          $ref: '#/components/schemas/Questions.GradingMethod'
        isCorrect:
          type: boolean
          description: Whether the submitted answer is correct. Omitted while grading is pending or failed, or when an automatically graded result uses an outdated correct-answer version. MANUAL results are not invalidated by correct-answer updates.
        gradedAt:
          type: string
          format: date-time
      description: Management view of a submitted answer and its grading result.
    Questions.ChoiceCorrectAnswer:
      type: object
      required:
        - type
        - selectedOptionId
      properties:
        type:
          type: string
          enum:
            - CHOICE
        selectedOptionId:
          $ref: '#/components/schemas/uuid'
      allOf:
        - $ref: '#/components/schemas/Questions.CorrectAnswerBase'
    Questions.ChoiceCorrectAnswerRequest:
      type: object
      required:
        - type
        - selectedOptionId
      properties:
        type:
          type: string
          enum:
            - CHOICE
        selectedOptionId:
          $ref: '#/components/schemas/uuid'
      description: Payload for storing the correct option of a CHOICE question.
    Questions.CorrectAnswer:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Questions.ChoiceCorrectAnswer'
        - $ref: '#/components/schemas/Questions.TextCorrectAnswer'
      discriminator:
        propertyName: type
        mapping:
          CHOICE: '#/components/schemas/Questions.ChoiceCorrectAnswer'
          TEXT: '#/components/schemas/Questions.TextCorrectAnswer'
      description: |-
        Question-global stored correct answer. This model is only exposed to
        EXPERIMENTER and ADMIN.
    Questions.CorrectAnswerBase:
      type: object
      required:
        - questionId
        - version
        - answerResultSyncStatus
        - updatedAt
      properties:
        questionId:
          $ref: '#/components/schemas/uuid'
        version:
          type: integer
          format: int64
          minimum: 1
        answerResultSyncStatus:
          allOf:
            - $ref: '#/components/schemas/Questions.AnswerResultSyncStatus'
          description: Whether all automatically gradable stored submissions have results evaluated against this version.
        updatedAt:
          type: string
          format: date-time
    Questions.CreateUpdateQuestionRequest:
      type: object
      required:
        - type
        - content
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/Questions.QuestionType'
          description: Question type
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Question content
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 5
                description: Option label, e.g., A, B, C
              content:
                type: string
                minLength: 1
                maxLength: 1024
                description: Option content
            required:
              - label
              - content
          description: List of options. For CHOICE type, this field is required and cannot be empty.
      description: Payload for creating or updating a question
    Questions.GradingMethod:
      type: string
      enum:
        - DETERMINISTIC
        - MANUAL
        - LLM
      description: Mechanism used to grade an answer. LLM is reserved for future text grading.
    Questions.GradingStatus:
      type: string
      enum:
        - PENDING
        - GRADED
        - FAILED
      description: Lifecycle state of an answer's grading result.
    Questions.Option:
      type: object
      required:
        - id
        - label
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Option ID
        label:
          type: string
          minLength: 1
          maxLength: 5
          description: Option label, e.g., A, B, C
        content:
          type: string
          minLength: 1
          maxLength: 1024
          description: Option content
      description: Option model (maps to options table)
    Questions.PaginatedAnswersResponse:
      type: object
      required:
        - items
        - totalPages
        - totalItems
        - currentPage
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Questions.AnswerWithResult'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
    Questions.Question:
      type: object
      required:
        - id
        - type
        - content
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Question ID
        type:
          allOf:
            - $ref: '#/components/schemas/Questions.QuestionType'
          description: Question type
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Question content/description
        options:
          type: array
          items:
            $ref: '#/components/schemas/Questions.Option'
          description: List of options (only populated when type is CHOICE)
      description: Question model (maps to questions table)
    Questions.QuestionType:
      type: string
      enum:
        - CHOICE
        - TEXT
      description: Question types
    Questions.SubmitAnswerRequest:
      type: object
      properties:
        selectedOptionId:
          allOf:
            - $ref: '#/components/schemas/uuid'
          description: Selected option ID (if it is a choice question)
        textAnswer:
          type: string
          minLength: 1
          maxLength: 2000
          description: Textual answer (if it is a text-based question)
      description: Payload for submitting an answer
    Questions.TextCorrectAnswer:
      type: object
      required:
        - type
        - referenceAnswer
      properties:
        type:
          type: string
          enum:
            - TEXT
        referenceAnswer:
          type: string
          minLength: 1
          maxLength: 2000
      allOf:
        - $ref: '#/components/schemas/Questions.CorrectAnswerBase'
    Questions.TextCorrectAnswerRequest:
      type: object
      required:
        - type
        - referenceAnswer
      properties:
        type:
          type: string
          enum:
            - TEXT
        referenceAnswer:
          type: string
          minLength: 1
          maxLength: 2000
      description: Payload for storing a reference answer for future TEXT grading.
    Questions.UpsertCorrectAnswerRequest:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Questions.ChoiceCorrectAnswerRequest'
        - $ref: '#/components/schemas/Questions.TextCorrectAnswerRequest'
      discriminator:
        propertyName: type
        mapping:
          CHOICE: '#/components/schemas/Questions.ChoiceCorrectAnswerRequest'
          TEXT: '#/components/schemas/Questions.TextCorrectAnswerRequest'
      description: Correct-answer payload. The discriminator must match the question type.
    Unauthorized:
      type: object
      required:
        - title
        - status
        - type
      properties:
        title:
          type: string
          enum:
            - Unauthorized
        status:
          type: number
          enum:
            - 401
        type:
          type: string
          enum:
            - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
    Users.PaginatedUsersResponse:
      type: object
      required:
        - items
        - totalPages
        - totalItems
        - currentPage
        - pageSize
        - hasNextPage
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Users.User'
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
      description: Paginated user directory response.
    Users.UpdateUserRolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Users.UserRole'
          minItems: 1
          maxItems: 3
      description: Fully replaces a user's roles. Roles must be unique.
    Users.User:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Users.UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: A SciEdu user profile.
    Users.UserRole:
      type: string
      enum:
        - STUDENT
        - EXPERIMENTER
        - ADMIN
      description: Roles that can be assigned to a SciEdu user.
    Versions:
      type: string
      enum:
        - 1.0.0
    uuid:
      type: string
      format: uuid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: access_token
servers:
  - url: https://api.dev.sciedu.sdc.nycu.club
    description: SciEdu server endpoint
    variables: {}
