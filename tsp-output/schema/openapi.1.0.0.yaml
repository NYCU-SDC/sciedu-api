openapi: 3.1.0
info:
  title: SciEdu API
  version: 1.0.0
tags:
  - name: Healthz
  - name: Questions
  - name: Chat
  - name: Content
  - name: Auth
  - name: Users
  - name: Courses
  - name: Pages
  - name: Experiments
  - name: Page Visits
  - name: Progress
paths:
  /api/auth/callback:
    get:
      operationId: OAuthCallback_callback
      description: |-
        Complete the Google OAuth login flow using a verified email identity. Before
        issuing a session, find the user by the stable provider subject or atomically
        create the OAuth identity and a user with the STUDENT role. Existing identities
        must not create duplicate users, and disabled users must be denied rather than
        recreated. Set session cookies on success and redirect the client to the
        originally requested URL.
      parameters:
        - name: code
          in: query
          required: false
          description: OAuth authorization code returned by Google.
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          description: OAuth state value used to validate the login attempt.
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: Auth_logout
      description: Revoke the entire refresh token family, clear session cookies, and end the session.
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token session cookie to revoke. Missing cookies still result in a cleared session.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/refresh:
    post:
      operationId: Auth_refresh
      description: |-
        Rotate the refresh token, set new session cookies, and return updated
        session expiry metadata.
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token session cookie to rotate.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - Auth
  /api/auth/session:
    get:
      operationId: Auth_session
      description: Return metadata for the authenticated session using session cookies.
      parameters:
        - name: access_token
          in: cookie
          required: true
          description: Access token session cookie.
          schema:
            type: string
          explode: false
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token session cookie.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
        - Auth
  /api/chat:
    get:
      operationId: Chats_list
      description: |-
        List the authenticated user's chats.

        Returns 200 with standard pagination, ordered by updatedAt descending. Only the owner may list chats. Course-chat history remains readable after experiment completion without exposing other users' chats. Errors: 400/401/500.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat.PaginatedChatResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    post:
      operationId: Chats_create
      description: |-
        Create a general chat or get a course-page chat.

        Request/compatibility: an empty body or {} preserves general-chat creation. courseContext must include experimentId, courseId and pageId together; an existing chat cannot be rebound from a general chat.
        Course permissions: authenticated STUDENT, experiment participant, assigned course, matching page with chatEnabled=true, and valid ACTIVE/schedule access. Derive the student from the session.
        Response: General chats and new course chats return 201 {chatId}; an existing binding for the same user/experiment/course/page returns 200 {chatId}. The response always uses chatId. This endpoint creates or retrieves the chat only; it does not generate messages. Find the chat first and create it before the first message.
        Consistency: insert Chat and binding in one transaction, with a unique user/experiment/course/page key and composite ownership FKs. Concurrent creators return the same chat without orphans. Do not move old unbound conversations.
        Errors: 400 incomplete context/invalid UUID, 401/403, 404 resources or mismatched scope, 409 COURSE_CHAT_READ_ONLY after completion/archival (use GET even when a binding exists), 500. General chats do not acquire experiment read-only restrictions.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat.ChatResult'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat.ChatResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - detail
                  - status
                  - type
                properties:
                  title:
                    type: string
                    description: The problem's title. A short, human-readable summary of the problem type.
                  detail:
                    type: string
                    description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
                  instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                  status:
                    type: number
                    enum:
                      - 409
                  type:
                    type: string
                    enum:
                      - urn:sciedu:problem:COURSE_CHAT_READ_ONLY
                description: Uses the existing summer ProblemDetail fields. Stable business types are urn:sciedu:problem:<kind>; do not parse detail. The current summer version does not support code/currentRevision/issues, so this contract does not require those extensions.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Chat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat.CreateChatRequest'
      security:
        - ApiKeyAuth: []
  /api/chat/course:
    get:
      operationId: Chats_course
      description: |-
        Find the authenticated student's course chat.

        Permissions: authenticated STUDENT with experiment/course/page access, deriving the user from the session. ACTIVE validates current course/page access and chat settings. Completed or archived experiments use the original binding for owned history, independent of later page settings or another current experiment.
        Response: 200 {chatId:UUID|null}; null means no chat exists. GET never creates data. Experiments and pages have separate chats. Load history with GET /chat/{chatId}.
        Errors: 400 missing/invalid query parameters, 401/403, 404 unknown/invisible resources or mismatched scope, 500. Read access does not authorize chat creation or messages.
      parameters:
        - name: experimentId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: courseId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: pageId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat.CourseChatLookup'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/presets:
    get:
      operationId: Presets_list
      description: |-
        List all presets available for course selection.

        Permissions: ADMIN or EXPERIMENTER.
        Response: 200 {items:[{id,description}]} containing all built-in and custom presets from the same SciLLM environment, without profile filtering or internal prompts/credentials.
        Upstream: Backend reads the catalog used by actual course-chat execution, preferably existing GET /admin/presets. This defines the public SciEdu adapter shape; upstream authorization and field mapping still require integration.
        Errors: 401/403, 503 PRESET_CATALOG_UNAVAILABLE (never turn a failure into an empty catalog), 500. Listing never changes a course selection.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materials.PresetCatalog'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
        '503':
          description: Service unavailable.
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - detail
                  - status
                  - type
                properties:
                  title:
                    type: string
                    description: The problem's title. A short, human-readable summary of the problem type.
                  detail:
                    type: string
                    description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
                  instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                  status:
                    type: number
                    enum:
                      - 503
                  type:
                    type: string
                    enum:
                      - urn:sciedu:problem:PRESET_CATALOG_UNAVAILABLE
                description: Uses the existing summer ProblemDetail fields. Stable business types are urn:sciedu:problem:<kind>; do not parse detail. The current summer version does not support code/currentRevision/issues, so this contract does not require those extensions.
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/stream/{messageId}:
    get:
      operationId: Stream_get
      description: |-
        Stream an assistant reply and generation errors.

        Permissions: owned assistant message; user-message IDs and another user's messages are not valid subscriptions. Preserve the current generation/reconnect flow; finishing an experiment does not abort previously accepted replies.
        Response: 200 text/event-stream, using origin/main unnamed data:<JSON> frames and its existing eight-type StreamEvent union. Preserve required delta.index, final part_end.part, message-part and agent-run fields. done and error terminate the stream.
        Errors before headers: 400/401/403/404/500 application/problem+json. After headers, emit type=error with error and code, then close. COURSE_CHAT_PRESET_UNAVAILABLE and CHAT_SERVICE_UNAVAILABLE match the persisted Message.errorCode; preserve client input and recover the failure from history.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Connection:
              required: true
              schema:
                type: string
                enum:
                  - keep-alive
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Chat.StreamEvent'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
  /api/chat/{chatId}:
    get:
      operationId: Chats_get
      description: |-
        Get an owned chat and its message history.

        Returns 200 with the existing Chat and messages shape, including origin/main agentic parts, characters and agentRuns; failed replies may add errorCode. Enforce owner access. Course-chat history remains readable after completion/archival, including replies accepted before completion and finished later. GET does not regenerate replies or modify submissions/progress. Errors: 400/401/403/404/500.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    allOf:
                      - $ref: '#/components/schemas/uuid'
                    description: Chat ID
                  title:
                    type: string
                    description: |-
                      Display title for the chat. Auto-generated by the backend (typically derived
                      from the first user message). May be an empty string for a chat that has not
                      yet received any messages. Truncation for display is the client's responsibility.
                  createdAt:
                    type: string
                    format: date-time
                    description: Timestamp when the chat was created
                  updatedAt:
                    type: string
                    format: date-time
                    description: |-
                      Timestamp when the chat was last updated. Updated whenever a new message is
                      appended to the chat. Used as the sort key for the chat history sidebar
                      (most recently updated first).
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat.Message'
                required:
                  - id
                  - title
                  - createdAt
                  - updatedAt
                  - messages
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    delete:
      operationId: Chats_delete
      description: Delete a chat session and all messages. Only the owner may delete; another user's chat returns 404. Existing deletion policy is unchanged by the material editing contract.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
      tags:
        - Chat
      security:
        - ApiKeyAuth: []
    post:
      operationId: Chats_createMessage
      description: |-
        Send a message and accept background generation.

        Permissions: owned Chat; bound course chats also verify binding and experiment write access on every send, retry and regeneration path. General-chat routes must not bypass course binding checks.
        Preset: course chats ignore the client preset and resolve the stored course selection without fallback. General chats retain existing preset behavior. Old unbound chats are not converted into course conversations.
        Response: 201 {message,replyMessageID}; replyMessageID is the precreated assistant UUID used to open SSE, not the user message.id.
        Acceptance boundary: coordinate the transaction with experiment state. Requests accepted before completion may release DB locks, finish generation and persist results afterward. Later requests, including retries/regeneration, return 409 COURSE_CHAT_READ_ONLY. Do not hold DB locks while waiting for SciLLM.
        Errors known before 201: 400/401/403/404, 409 COURSE_CHAT_READ_ONLY or COURSE_CHAT_PRESET_UNAVAILABLE, 503 CHAT_SERVICE_UNAVAILABLE, 500. After 201, emit SSE error.code and persist the same Message.errorCode; do not change the HTTP status retroactively.
        Upstream mapping: recognize unavailable presets only from an agreed structured signal (candidate PRESET_NOT_FOUND), never arbitrary 400/detail text. The upstream signal still requires SciLLM agreement.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Chat.Message'
                  replyMessageID:
                    $ref: '#/components/schemas/uuid'
                required:
                  - message
                  - replyMessageID
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.InvalidRequestProblem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - title
                      - detail
                      - status
                      - type
                    properties:
                      title:
                        type: string
                        description: The problem's title. A short, human-readable summary of the problem type.
                      detail:
                        type: string
                        description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
                      instance:
                        type: string
                        description: A URI reference that identifies the specific occurrence of the problem.
                      status:
                        type: number
                        enum:
                          - 409
                      type:
                        type: string
                        enum:
                          - urn:sciedu:problem:COURSE_CHAT_READ_ONLY
                    description: Uses the existing summer ProblemDetail fields. Stable business types are urn:sciedu:problem:<kind>; do not parse detail. The current summer version does not support code/currentRevision/issues, so this contract does not require those extensions.
                  - type: object
                    required:
                      - title
                      - detail
                      - status
                      - type
                    properties:
                      title:
                        type: string
                        description: The problem's title. A short, human-readable summary of the problem type.
                      detail:
                        type: string
                        description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
                      instance:
                        type: string
                        description: A URI reference that identifies the specific occurrence of the problem.
                      status:
                        type: number
                        enum:
                          - 409
                      type:
                        type: string
                        enum:
                          - urn:sciedu:problem:COURSE_CHAT_PRESET_UNAVAILABLE
                    description: Uses the existing summer ProblemDetail fields. Stable business types are urn:sciedu:problem:<kind>; do not parse detail. The current summer version does not support code/currentRevision/issues, so this contract does not require those extensions.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Materials.ServerProblem'
        '503':
          description: Service unavailable.
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - detail
                  - status
                  - type
                properties:
                  title:
                    type: string
                    description: The problem's title. A short, human-readable summary of the problem type.
                  detail:
                    type: string
                    description: The problem's detail. A human-readable explanation specific to this occurrence of the problem.
                  instance:
                    type: string
                    description: A URI reference that identifies the specific occurrence of the problem.
                  status:
                    type: number
                    enum:
                      - 503
                  type:
                    type: string
                    enum:
                      - urn:sciedu:problem:CHAT_SERVICE_UNAVAILABLE
                description: Uses the existing summer ProblemDetail fields. Stable business types are urn:sciedu:problem:<kind>; do not parse detail. The current summer version does not support code/currentRevision/issues, so this contract does not require those extensions.
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat.SendMessageRequest'
      security:
        - ApiKeyAuth: []
  /api/content/media:
    post:
      operationId: Content_createMedia
      description: |-
        Upload a material image or generic media.

        Permissions: ADMIN or EXPERIMENTER; persist uploader identity for staging authorization and cleanup.
        Request: multipart/form-data with the existing content file part and optional purpose=material-image. Idempotency-Key is required; the semantic hash includes the file digest and purpose.
        Material images: JPEG, PNG or WebP only, at most 10 MiB and 40 decoded megapixels. Check actual MIME and decoded dimensions; reject SVG and HTML. Omitting purpose preserves the existing generic media policy.
        Response: 201 MaterialImageResource for material-image, including controlled url, mimeType, dimensions, sizeBytes and optional sha256; otherwise the existing MediaContent. Editor hydration never exposes storage paths or file bytes.
        Retries: coordinate staged storage and the operation record so the same key returns the same resource ID. Backend cleanup handles failed leftovers.
        Errors: 400, 401/403, 409 key conflict, 413 size or pixel limit, 415 unsupported media, 500.
      parameters:
        - $ref: '#/components/parameters/Materials.IdempotencyHeader'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
