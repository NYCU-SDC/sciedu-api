        configuration:
          $ref: '#/components/schemas/Experiments.ExperimentConfiguration'
        createdBy:
          $ref: '#/components/schemas/uuid'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Experiments.ExperimentConfiguration:
      type: object
      required:
        - maxAttempts
        - allowRetry
        - showScore
        - showExplanations
        - gradingMode
        - correctAnswerReleaseMode
      properties:
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
          description: Maximum total attempts. Must be 1 when allowRetry is false and at least 2 when allowRetry is true.
        allowRetry:
          type: boolean
          description: Whether a participant may start another attempt.
        showScore:
          type: boolean
          description: Whether scores are visible to participants. Independent of correctAnswerReleaseMode.
        showExplanations:
          type: boolean
          description: Whether grading explanations are visible to participants. Independent of correctAnswerReleaseMode.
        gradingMode:
          allOf:
            - $ref: '#/components/schemas/Experiments.GradingMode'
          description: How submitted answers are graded.
        correctAnswerReleaseMode:
          allOf:
            - $ref: '#/components/schemas/Experiments.CorrectAnswerReleaseMode'
          description: Controls when correct answers are released. This does not control score or explanation visibility.
      description: Experiment-specific retry, grading, score, explanation, and correct-answer release settings. Every field is required.
