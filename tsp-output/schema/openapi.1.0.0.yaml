        Permissions: ADMIN or EXPERIMENTER. This endpoint is an explicit exception to the v2 legacy-mutation restriction. Preserve existing status rules; returning to DRAFT never removes the permanent content/preset lock.
        Request: v2 requires Idempotency-Key and expectedRevision; legacy retains its existing body and optional header. Status remains DRAFT, PUBLISHED or ARCHIVED.
        Publication: under the same Course lock and transaction, require at least one page, visible content on each page, complete nodes/questions/references, accessible resources and supported profiles/simulations. TEXT questions may lack correct answers; that does not establish automatic grading readiness.
        Preset: any chatEnabled=true page requires a SELECTED preset; all-chat-disabled courses may publish without one. Removed or temporarily unverifiable selected presets produce warnings, preserving their identifiers and allowing publication and later experiment activation.
        Response: 200 CourseWriteResult with revision+1; do not create experiments or assign students. Authorize before successful-key replay, even if the revision is now stale.
